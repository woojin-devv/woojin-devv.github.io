name: Deploy Gatsby to GitHub Pages

on:
  push:
    branches: [master]
  repository_dispatch:
    types: [coding-tests-updated]
  schedule:
    # 매일 오전 3시(Asia/Seoul)에 누락된 코딩테스트 기록을 동기화합니다.
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog
        uses: actions/checkout@v4
      - name: Checkout coding test notes
        uses: actions/checkout@v4
        with:
          repository: woojin-devv/coding-test-notes
          path: external/coding-test-notes
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync coding test notes
        run: npm run sync-coding-tests
      - run: npm run build
        env:
          GATSBY_GISCUS_REPO_ID: ${{ vars.GATSBY_GISCUS_REPO_ID }}
          GATSBY_GISCUS_CATEGORY_ID: ${{ vars.GATSBY_GISCUS_CATEGORY_ID }}
      - name: Build Storybook under /storybook
        run: npm run build-storybook -- --output-dir public/storybook
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
